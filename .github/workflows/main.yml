name: CI

on: 
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
  
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Dotnet 10
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup Dotnet 9
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI workloads
      run: dotnet workload install maui maui-tizen

    - name: Exclude local MAUI sample from CI build
      run: dotnet sln Kinetq.LiquidPages.sln remove src/Kinetq.LiquidPages.Maui.Sample/Kinetq.LiquidPages.Maui.Sample.csproj
          
    - name: Restore Solution
      run: dotnet restore Kinetq.LiquidPages.sln
      
    - name: Build Solution
      run: dotnet build Kinetq.LiquidPages.sln -c Release --no-restore 
      
    - name: Test Solution
      run: dotnet test Kinetq.LiquidPages.sln
      
    - name: Publish Visual Studio Extension
      uses: cezarypiatek/VsixPublisherAction@1.0
      continue-on-error: true
      with:
        extension-file: src/Kinetq.LiquidPages.Extension/bin/Release/net8.0-windows8.0/Kinetq.LiquidPages.Extension.vsix
        publish-manifest-file: src/Kinetq.LiquidPages.Extension/publishManifest.json
        personal-access-code: ${{secrets.MARKETPLACE_PAT}}
      
    - name: Publish Liquid Simple Server
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages/Kinetq.LiquidPages.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true
          
    - name: Publish Liquid EmbedIO Module
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.EmbedIO/Kinetq.LiquidPages.EmbedIO.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid GenHTTP Handler
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.GenHTTP/Kinetq.LiquidPages.GenHTTP.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish MAUI LiquidWebView
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.Maui/Kinetq.LiquidPages.Maui.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid AspNetCore Middleware
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.AspNetCore/Kinetq.LiquidPages.AspNetCore.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid SimpleW Module
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.SimpleW/Kinetq.LiquidPages.SimpleW.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid Templates
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.Templates/Kinetq.LiquidPages.Templates.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

  deploy-perf-results:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Dotnet 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run setup
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        dotnet tool update --global Microsoft.Crank.Controller --version "0.2.0-*"
        dotnet tool update --global Microsoft.Crank.Agent --version "0.2.0-*"
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Run crank
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        crank-agent > crank-agent.log 2>&1 &
        AGENT_PID=$!
        trap 'kill $AGENT_PID' EXIT
        sleep 5

        scenarios=(
          "aspnetcore-liquid:liquid_results_aspnetcore.json"
          "aspnetcore-razor:liquid_results_razor.json"
          "embedio-home:liquid_results_embedio.json"
          "netcoreserver-home:liquid_results_netcoreserver.json"
          "genhttp-home:liquid_results_genhttp.json"
          "simplew-home:liquid_results_simplew.json"
          "simplew-razor-home:liquid_results_simplew_razor.json"
        )

        for entry in "${scenarios[@]}"; do
          scenario="${entry%%:*}"
          output="${entry##*:}"
          crank --config liquidpages.benchmark.yaml --scenario "$scenario" --profile local --json "$output"
        done

    - name: Build perf generator
      working-directory: ${{ github.workspace }}
      shell: bash
      run: dotnet build src/Kinetq.LiquidPages.Perf/Kinetq.LiquidPages.Perf.csproj -c Release

    - name: Generate perf-results.html
      working-directory: ${{ github.workspace }}
      shell: bash
      run: dotnet ./src/Kinetq.LiquidPages.Perf/bin/Release/net10.0/Kinetq.LiquidPages.Perf.dll .

    - name: Upload perf results artifact
      uses: actions/upload-artifact@v4
      with:
        name: perf-results
        path: |
          perf-results.html
          liquid_results_*.json

