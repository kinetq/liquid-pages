name: CI

on: 
  push:
    branches:
      - master

jobs:
  build:
  
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Setup Dotnet
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI workloads
      run: dotnet workload install maui maui-tizen
          
    - name: Restore Solution
      run: dotnet restore Kinetq.LiquidPages.sln
      
    - name: Build Solution
      run: dotnet build Kinetq.LiquidPages.sln -c Release --no-restore 
      
    - name: Test Solution
      run: dotnet test Kinetq.LiquidPages.sln
      
    - name: Publish Visual Studio Extension
      uses: cezarypiatek/VsixPublisherAction@1.0
      continue-on-error: true
      with:
        extension-file: src/Kinetq.LiquidPages.Extension/bin/Release/net8.0-windows8.0/Kinetq.LiquidPages.Extension.vsix
        publish-manifest-file: src/Kinetq.LiquidPages.Extension/publishManifest.json
        personal-access-code: ${{secrets.MARKETPLACE_PAT}}
      
    - name: Publish Liquid Simple Server
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages/Kinetq.LiquidPages.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true
          
    - name: Publish Liquid EmbedIO Module
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.EmbedIO/Kinetq.LiquidPages.EmbedIO.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid GenHTTP Handler
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.GenHTTP/Kinetq.LiquidPages.GenHTTP.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish MAUI LiquidWebView
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.Maui/Kinetq.LiquidPages.Maui.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid AspNetCore Middleware
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.AspNetCore/Kinetq.LiquidPages.AspNetCore.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid SimpleW Module
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.SimpleW/Kinetq.LiquidPages.SimpleW.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

    - name: Publish Liquid Templates
      uses: alirezanet/publish-nuget@v3.0.0
      with:
          PROJECT_FILE_PATH: src/Kinetq.LiquidPages.Templates/Kinetq.LiquidPages.Templates.csproj
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
          INCLUDE_SYMBOLS: true

